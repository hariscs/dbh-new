name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  APP_DIR: /var/www/dbh
  APP_PORT: '3001'
  HEALTH_URL: http://127.0.0.1:3001/
  KEEP_RELEASES: '2'
  MIN_FREE_MB: '2200'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_REVALIDATE_SECONDS: ${{ secrets.WORDPRESS_REVALIDATE_SECONDS }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: pnpm build

      - name: Assemble deploy artifact
        run: |
          set -euo pipefail
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          tar -czf release.tar.gz -C .next/standalone .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure server disk space
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "sudo env APP_DIR='$APP_DIR' MIN_FREE_MB='$MIN_FREE_MB' bash -seuo pipefail" <<'REMOTE'
          rm -f /tmp/release-*.tar.gz

          CURRENT="$(readlink -f "$APP_DIR/current" 2>/dev/null || true)"
          if [ -d "$APP_DIR/releases" ]; then
            cd "$APP_DIR/releases"
            for old in */; do
              [ -d "$old" ] || continue
              [ "$(readlink -f "$old")" = "$CURRENT" ] && continue
              rm -rf -- "$old"
            done
          fi

          FREE_MB=$(df -Pm "$APP_DIR" | awk 'NR==2 {print $4}')
          if [ "$FREE_MB" -lt "$MIN_FREE_MB" ]; then
            echo "::error::Only ${FREE_MB}MB free at $APP_DIR after cleanup, need ${MIN_FREE_MB}MB."
            du -sh "$APP_DIR"/* /var/www/* 2>/dev/null | sort -rh | head -10
            exit 1
          fi
          REMOTE

      - name: Upload artifact to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key release.tar.gz \
            "$SSH_USER@$SSH_HOST:/tmp/release-${{ github.sha }}.tar.gz"

      - name: Release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "sudo env APP_DIR='$APP_DIR' APP_PORT='$APP_PORT' HEALTH_URL='$HEALTH_URL' \
              KEEP_RELEASES='$KEEP_RELEASES' MIN_FREE_MB='$MIN_FREE_MB' SHA='$SHA' \
              RUN_ID='${{ github.run_id }}' bash -seuo pipefail" <<'REMOTE'
          PM2=/root/.nvm/versions/node/v20.20.2/bin/pm2

          RELEASE_DIR="$APP_DIR/releases/$SHA-$RUN_ID"
          PREVIOUS="$(readlink -f "$APP_DIR/current" 2>/dev/null || true)"

          if [ -d "$APP_DIR/releases" ]; then
            cd "$APP_DIR/releases"
            for old in */; do
              [ -d "$old" ] || continue
              [ "$(readlink -f "$old")" = "$PREVIOUS" ] && continue
              rm -rf -- "$old"
            done
          fi

          FREE_MB=$(df -Pm "$APP_DIR" | awk 'NR==2 {print $4}')
          if [ "$FREE_MB" -lt "$MIN_FREE_MB" ]; then
            echo "::error::Only ${FREE_MB}MB free at $APP_DIR, need ${MIN_FREE_MB}MB."
            echo "Free space or grow the EBS volume, then re-run. Largest consumers:"
            du -sh "$APP_DIR"/* /var/www/* 2>/dev/null | sort -rh | head -10
            rm -f "/tmp/release-$SHA.tar.gz"
            exit 1
          fi

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "/tmp/release-$SHA.tar.gz" -C "$RELEASE_DIR"
          rm -f "/tmp/release-$SHA.tar.gz"

          ln -sfn "$APP_DIR/shared/.env.local" "$RELEASE_DIR/.env.local"

          ln -sfnT "$RELEASE_DIR" "$APP_DIR/current.tmp"
          mv -Tf "$APP_DIR/current.tmp" "$APP_DIR/current"

          $PM2 delete dbh >/dev/null 2>&1 || true
          $PM2 start "$APP_DIR/shared/ecosystem.config.cjs" --update-env
          $PM2 save >/dev/null

          ok=false
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 -o /dev/null "$HEALTH_URL"; then
              pid="$($PM2 pid dbh 2>/dev/null | tr -d '[:space:]')"
              if [ -n "$pid" ] && [ "$pid" != "0" ] \
                 && [ "$(readlink -f "/proc/$pid/cwd" 2>/dev/null)" = "$RELEASE_DIR" ]; then
                ok=true; break
              fi
            fi
            sleep 2
          done

          if [ "$ok" != true ]; then
            echo "::error::Health check failed on $HEALTH_URL — rolling back"
            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
              ln -sfnT "$PREVIOUS" "$APP_DIR/current.tmp"
              mv -Tf "$APP_DIR/current.tmp" "$APP_DIR/current"
              $PM2 delete dbh >/dev/null 2>&1 || true
              $PM2 start "$APP_DIR/shared/ecosystem.config.cjs" --update-env
              $PM2 save >/dev/null
              echo "Rolled back to $PREVIOUS"
            else
              echo "::error::No previous release to roll back to — dbh is DOWN"
            fi
            $PM2 logs dbh --lines 60 --nostream || true
            exit 1
          fi

          cd "$APP_DIR/releases"
          ls -1dt */ 2>/dev/null | tail -n "+$((KEEP_RELEASES + 1))" | while read -r old; do
            [ "$(readlink -f "$old")" = "$(readlink -f "$APP_DIR/current")" ] && continue
            rm -rf -- "$old"
          done

          echo "Deployed $SHA"
          df -h / | tail -1
          REMOTE
